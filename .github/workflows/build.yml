name: Build and push

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum

      # golangci-lint action handles install + cache + lint in one step.
      # Backend `make check` runs fmt-check + vet + test (lint is delegated here
      # to avoid running golangci-lint twice).
      - name: golangci-lint (backend)
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4
          working-directory: backend

      - name: Backend fmt-check + vet + test
        working-directory: backend
        run: make fmt-check vet test

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Frontend type-check
        working-directory: frontend
        run: npm run check

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend format check
        working-directory: frontend
        run: npm run format:check

  build:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    outputs:
      image-digest: ${{ steps.build-and-push.outputs.digest }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify CHANGELOG entry exists for tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if ! grep -qE "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "::error::No '## [${VERSION}]' section in CHANGELOG.md for tag ${TAG}."
            echo "::error::Add the section before pushing the tag, or delete the tag with: git tag -d ${TAG} && git push --delete origin ${TAG}"
            exit 1
          fi
          echo "OK: CHANGELOG.md has section for ${VERSION}"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Verify service worker manifest injection
        run: |
          SW=frontend/build/sw.js
          if [ ! -f "$SW" ]; then
            echo "ERROR: $SW not found — generateSW did not produce the file"
            exit 1
          fi
          if grep -q 'self\.__WB_MANIFEST' "$SW"; then
            echo "ERROR: precache manifest was not injected into $SW"
            exit 1
          fi
          echo "OK: $SW precache manifest is injected"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          NOTES_FILE="$(mktemp)"
          awk -v ver="${VERSION}" '
            $0 ~ "^## \\[" ver "\\]" { capture=1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > "${NOTES_FILE}"
          if [ ! -s "${NOTES_FILE}" ]; then
            echo "::error::Release notes for ${VERSION} extracted empty — section header present but no body content?"
            exit 1
          fi
          {
            echo "Container image: \`ghcr.io/${GITHUB_REPOSITORY}:${VERSION}\`"
            echo "Pull command: \`docker pull ghcr.io/${GITHUB_REPOSITORY}:${VERSION}\`"
            echo ""
            echo "---"
            echo ""
            cat "${NOTES_FILE}"
          } > "${NOTES_FILE}.final"
          mv "${NOTES_FILE}.final" "${NOTES_FILE}"
          echo "notes-file=${NOTES_FILE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.notes-file }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: false
