<!doctype html>
<html lang="en" data-accent="cyan">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />

    <!-- PWA -->
    <meta name="theme-color" content="#0a0b0d" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Skua" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />

    <!-- No-flash theme bootstrap: apply theme class before first paint so a
         light-mode user doesn't see a dark flash on reload. Mirrors the
         themeStore's storage key and validation. -->
    <script>
      ;(function () {
        try {
          var t = localStorage.getItem('skua-theme')
          if (t !== 'auto' && t !== 'dark' && t !== 'light') t = 'auto'
          document.documentElement.classList.add('theme-' + t)
        } catch (e) {
          document.documentElement.classList.add('theme-auto')
        }
      })()
    </script>

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
