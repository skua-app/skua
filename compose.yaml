services:
  skua:
    image: ghcr.io/skua-app/skua:${TAG:-latest}
    container_name: skua
    restart: unless-stopped
    ports:
      - "3200:3200"
    environment:
      # FRIGATE_URL and GO2RTC_URL are optional from v0.9.0 — omit them and
      # open http://<docker-host>:3200 to enter them in the first-run setup
      # wizard, which saves to /data/config.yaml. Env always wins over the
      # overlay file, so setting them here keeps the wizard out of the way.
      FRIGATE_URL: "http://frigate:5000"
      GO2RTC_URL: "http://frigate:1984"
      LOG_LEVEL: "info"
      LOG_FORMAT: "json"
      WHEP_TIMEOUT: "10s"
      PREFS_PATH: "/data/prefs.json"
      GROUPS_CONFIG_PATH: "/data/groups.yaml"
    volumes:
      # The container runs as non-root (uid/gid 65532, distroless nonroot),
      # so ./data must be writable by it — `chown -R 65532:65532 ./data`
      # once on the host, or switch to a Docker named volume.
      - ./data:/data
    healthcheck:
      test: ["CMD", "/server", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
